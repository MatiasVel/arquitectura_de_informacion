# Configuración de Netlify.
# El sitio es estático (HTML, CSS y JavaScript sin dependencias): no hay paso de compilación.
# El "comando de build" sólo corre las pruebas de los datos (etapas, conexiones, glosario y
# capturas); si alguna falla, Netlify no publica.

[build]
  publish = "public"
  command = "node --test tests/*.test.mjs"

[build.environment]
  NODE_VERSION = "22"

# Encabezados de seguridad para todo el sitio.
# frame-ancestors * permite mostrar el sitio dentro de otras páginas (presentaciones o aulas
# virtuales): no hay inicio de sesión ni datos sensibles que proteger de un "clickjacking".
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors *"

# Las fuentes no cambian: se pueden guardar en caché por un año.
[[headers]]
  for = "/fuentes/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
